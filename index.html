<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SPARK">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SPARK · 灵感雷达</title>
<style>
  :root {
    --bg: #F5F5F5; --card: #FFFFFF; --ink: #141414; --ink2: #6E6E6E; --ink3: #9B9B9B;
    --line: #E8E8E8; --spark: #FFD60A; --dark: #141414;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overscroll-behavior-y: contain; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { display: block; }
  .wordmark { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .tagline { font-size: 12px; color: var(--ink3); margin: 2px 0 16px 34px; letter-spacing: 0.3px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .clock { font-size: 11px; color: var(--ink3); text-align: right; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .clock b { display: block; color: var(--ink2); font-weight: 500; font-size: 12px; }
  .refresh-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
  }
  .refresh-btn svg { transition: transform .5s ease; }
  .refresh-btn.spinning svg { transform: rotate(360deg); }

  .ptr {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%;
    transform: translateX(-50%) translateY(-56px);
    background: var(--dark); color: #F5F5F5; font-size: 12px; line-height: 1;
    padding: 9px 16px; border-radius: 999px; z-index: 60;
    transition: transform .18s ease; display: flex; align-items: center; gap: 7px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none; white-space: nowrap;
  }
  .ptr.show { transform: translateX(-50%) translateY(0); }
  .ptr .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--spark); }
  .ptr.loading .dot { animation: pulse 1s infinite; }

  .seg { display: flex; gap: 2px; background: #EBEBEB; border-radius: 999px; padding: 3px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    flex: 0 0 auto; border: 0; background: transparent; border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 13px; color: var(--ink2); cursor: pointer;
    transition: background .18s ease, color .18s ease; white-space: nowrap;
  }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .feed { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; cursor: pointer; transition: transform .12s ease;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .card:active { transform: scale(.985); }
  .card .text { flex: 1; min-width: 0; }
  .card .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .chip {
    font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 8px; border-radius: 999px;
    background: rgba(255, 214, 10, .28); color: #7A6200; white-space: nowrap;
  }
  .fresh { width: 6px; height: 6px; border-radius: 50%; background: var(--spark); box-shadow: 0 0 0 3px rgba(255,214,10,.25); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .card h2 { font-size: 15px; font-weight: 600; line-height: 1.45; margin-bottom: 4px; }
  .card p { font-size: 13px; color: var(--ink2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 8px; font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .thumb {
    width: 72px; height: 72px; border-radius: 12px; object-fit: cover; flex: 0 0 auto;
    background: #EFEFEF; border: 1px solid var(--line);
  }

  .card.hero { background: var(--dark); border-color: var(--dark); color: #F5F5F5; display: block; padding: 0; overflow: hidden; }
  .card.hero .hero-img { width: 100%; height: 168px; object-fit: cover; display: block; background: #232323; }
  .card.hero .text { padding: 14px 16px; }
  .card.hero p { color: #A8A8A8; }
  .card.hero .meta { color: #8A8A8A; }
  .card.hero .chip { background: var(--spark); color: #141414; }
  .card.hero h2 { font-size: 17px; }

  .summary-bar { font-size: 12px; color: var(--ink2); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.6; }
  .empty { text-align: center; color: var(--ink3); font-size: 13px; padding: 48px 0; }
  footer { margin-top: 24px; text-align: center; font-size: 11px; color: var(--ink3); line-height: 1.8; }

  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); left: 50%;
    transform: translateX(-50%) translateY(90px); opacity: 0;
    max-width: calc(100vw - 48px); white-space: normal; text-align: center; line-height: 1.5;
    background: var(--dark); color: #F5F5F5; font-size: 12px; padding: 10px 16px;
    border-radius: 16px; z-index: 70;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none;
  }
  .toast.show { animation: toastLife 2.8s ease forwards; }
  @keyframes toastLife {
    0% { transform: translateX(-50%) translateY(90px); opacity: 0; }
    10% { transform: translateX(-50%) translateY(0); opacity: 1; }
    82% { transform: translateX(-50%) translateY(0); opacity: 1; }
    100% { transform: translateX(-50%) translateY(90px); opacity: 0; }
  }

  /* 阅读视图：普通文档流全页视图，不用 fixed/transform 浮层，
     从根上规避部分机型（MIUI 等）可视视口被浮层卡偏的问题 */
  .reader { display: none; }
  .reader.open { display: block; animation: readerIn .18s ease; }
  @keyframes readerIn { from { opacity: 0 } to { opacity: 1 } }
  .reader .rv-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rv-back {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
  }
  .rv-tip { font-size: 11px; color: var(--ink3); }
  .reader .r-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .reader .r-head .row1 { margin-bottom: 8px; }
  .reader h1 { font-size: 20px; font-weight: 700; line-height: 1.5; }
  .reader .r-meta { margin-top: 8px; font-size: 11px; color: var(--ink3); }
  .reader .r-body { padding-bottom: 8px; }
  .reader .r-body p { font-size: 15px; line-height: 1.8; color: #2B2B2B; margin-bottom: 14px; }
  .reader .r-body h3 { font-size: 16px; margin: 18px 0 8px; }
  .reader .r-body img { max-width: 100%; border-radius: 10px; margin: 6px 0 14px; }
  .reader .r-body a { color: #7A6200; }
  .skeleton { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
  .skeleton i { display: block; height: 13px; border-radius: 7px; background: linear-gradient(90deg,#ECECEC,#F7F7F7,#ECECEC); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
  .skeleton i:nth-child(2n) { width: 88%; } .skeleton i:nth-child(3n) { width: 62%; }
  @keyframes shimmer { 0% { background-position: 120% 0 } 100% { background-position: -80% 0 } }
  .r-foot { display: flex; gap: 10px; padding: 14px 0 calc(env(safe-area-inset-bottom, 0px) + 8px); border-top: 1px solid var(--line); }
  .r-foot button {
    flex: 1; border: 0; border-radius: 999px; padding: 12px 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .r-foot .primary { background: var(--dark); color: var(--spark); }
  .r-foot .ghost { background: #EBEBEB; color: var(--ink2); flex: 0 0 96px; }
</style>
</head>
<body>
<div class="ptr" id="ptr"><span class="dot"></span><span id="ptrText">下拉获取最新情报</span></div>

<div id="feedView">
<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <rect width="26" height="26" rx="7" fill="#141414"/>
      <path d="M14.2 4.5 7.5 14.2h4l-1.7 7.3 6.7-9.7h-4l1.7-7.3z" fill="#FFD60A"/>
    </svg>
    <span class="wordmark">SPARK</span>
  </div>
  <div class="head-right">
    <div class="clock" id="clock"><b>灵感雷达</b><span id="updated">加载中…</span></div>
    <button class="refresh-btn" id="refreshBtn" aria-label="刷新">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
<div class="tagline">Every open, a new spark.</div>
<div class="summary-bar" id="summaryBar" style="display:none"></div>
<nav class="seg" id="seg" aria-label="分类"></nav>
<main class="feed" id="feed"><div class="empty">正在接收火花…</div></main>
<footer>SPARK · 灵感雷达 — 数据来自公开 RSS 订阅源<br>每小时自动更新 · 下拉获取最新快照 · 更新于 <span id="footTime"></span></footer>
</div>

<div class="toast" id="toast"></div>

<section class="reader" id="reader" aria-hidden="true">
  <div class="rv-topbar">
    <button class="rv-back" id="rClose" aria-label="返回列表">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3 5 8l5 5" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="rv-tip">下拉页面也可以返回</span>
  </div>
  <div class="r-head">
    <div class="row1"><span class="chip" id="rChip"></span></div>
    <h1 id="rTitle"></h1>
    <div class="r-meta" id="rMeta"></div>
  </div>
  <div class="r-body" id="rBody"></div>
  <div class="r-foot">
    <button class="primary" id="rOpen">阅读原文</button>
  </div>
</section>

<script>
(function () {
  var state = { filter: '全部', data: null, loading: false };
  var segEl = document.getElementById('seg');
  var feedEl = document.getElementById('feed');
  var ptrEl = document.getElementById('ptr');
  var ptrText = document.getElementById('ptrText');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var diff = Date.now() - d.getTime();
    if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function fmtFull(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtShort(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function isFresh(iso) {
    var d = new Date(iso);
    return !isNaN(d) && (Date.now() - d.getTime()) < 6 * 3600000;
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth; /* 强制重排，让连续播报也能重启动画 */
    toastEl.classList.add('show');
  }

  function renderSeg() {
    var tags = ['全部'];
    state.data.items.forEach(function (it) { if (it.tag && tags.indexOf(it.tag) < 0) tags.push(it.tag); });
    if (tags.indexOf(state.filter) < 0) state.filter = '全部';
    segEl.innerHTML = '';
    tags.forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = t;
      b.className = t === state.filter ? 'on' : '';
      b.addEventListener('click', function () { state.filter = t; renderSeg(); renderFeed(); });
      segEl.appendChild(b);
    });
  }

  function makeThumb(url, className) {
    var img = document.createElement('img');
    img.className = className;
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    img.onerror = function () { img.remove(); };
    img.src = url;
    return img;
  }

  function renderFeed() {
    feedEl.innerHTML = '';
    var items = state.data.items.filter(function (it) { return state.filter === '全部' || it.tag === state.filter; });
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = '这个分类暂时没有新火花';
      feedEl.appendChild(e); return;
    }
    items.forEach(function (it, i) {
      var isHero = (i === 0 && state.filter === '全部');
      var c = document.createElement('article');
      c.className = 'card' + (isHero ? ' hero' : '');
      var text = document.createElement('div'); text.className = 'text';
      var r1 = document.createElement('div'); r1.className = 'row1';
      var chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = it.tag || '未分类';
      r1.appendChild(chip);
      if (isFresh(it.publishedAt)) { var f = document.createElement('span'); f.className = 'fresh'; f.title = '6 小时内'; r1.appendChild(f); }
      var h = document.createElement('h2'); h.textContent = it.title || '';
      text.appendChild(r1); text.appendChild(h);
      if (it.summary) { var p = document.createElement('p'); p.textContent = it.summary; text.appendChild(p); }
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = [it.source, fmt(it.publishedAt)].filter(Boolean).join(' · ');
      text.appendChild(m);
      if (isHero) {
        if (it.image) c.appendChild(makeThumb(it.image, 'hero-img'));
        c.appendChild(text);
      } else {
        c.appendChild(text);
        if (it.image) c.appendChild(makeThumb(it.image, 'thumb'));
      }
      c.addEventListener('click', function () { openReader(it); });
      feedEl.appendChild(c);
    });
  }

  function renderAll() {
    document.getElementById('updated').textContent = fmtFull(state.data.updatedAt) + ' 更新';
    document.getElementById('footTime').textContent = fmtFull(state.data.updatedAt);
    var bar = document.getElementById('summaryBar');
    if (state.data.summary) { bar.textContent = state.data.summary; bar.style.display = ''; }
    renderSeg(); renderFeed();
  }

  /* ---------- 阅读模式 ---------- */
  var reader = document.getElementById('reader');
  var rBody = document.getElementById('rBody');
  var currentUrl = '';
  var readerAbort = null;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function mdToHtml(md) {
    md = md.slice(0, 8000);
    var blocks = md.split(/\n{2,}/);
    var out = [];
    blocks.forEach(function (b) {
      var t = b.trim();
      if (!t) return;
      t = esc(t);
      t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      t = t.replace(/!\[[^\]]*\]\((https?:[^)\s]+)\)/g, '<img loading="lazy" referrerPolicy="no-referrer" src="$1" onerror="this.remove()">');
      if (/^#{1,4}\s/.test(t)) out.push('<h3>' + t.replace(/^#{1,4}\s+/, '') + '</h3>');
      else out.push('<p>' + t.replace(/\n/g, '<br>') + '</p>');
    });
    return out.join('');
  }
  function skeleton() {
    var s = document.createElement('div'); s.className = 'skeleton';
    for (var i = 0; i < 7; i++) s.appendChild(document.createElement('i'));
    return s;
  }
  /* 阅读视图是普通文档流页面：打开时隐藏列表并回到顶部，
     关闭时还原列表滚动位置。没有任何 fixed/transform 浮层参与。 */
  var readerOpen = false;
  var feedScrollY = 0;
  function openReader(it) {
    document.getElementById('rChip').textContent = it.tag || '未分类';
    document.getElementById('rTitle').textContent = it.title || '';
    document.getElementById('rMeta').textContent = [it.source, fmtFull(it.publishedAt)].filter(Boolean).join(' · ');
    currentUrl = it.url || '';
    rBody.innerHTML = '';
    var intro = document.createElement('p');
    intro.innerHTML = '<b>摘要</b> · ' + esc(it.summary || '暂无摘要');
    rBody.appendChild(intro);
    feedScrollY = window.scrollY || 0;
    document.getElementById('feedView').style.display = 'none';
    reader.classList.add('open');
    reader.setAttribute('aria-hidden', 'false');
    readerOpen = true;
    window.scrollTo(0, 0);
    if (!currentUrl) return;
    rBody.appendChild(skeleton());
    if (readerAbort) readerAbort.abort();
    readerAbort = new AbortController();
    var timer = setTimeout(function () { readerAbort.abort(); }, 15000);
    fetch('https://r.jina.ai/' + currentUrl, { signal: readerAbort.signal })
      .then(function (r) { if (!r.ok) throw new Error('bad status'); return r.text(); })
      .then(function (text) {
        clearTimeout(timer);
        var sk = rBody.querySelector('.skeleton'); if (sk) sk.remove();
        var cut = text.indexOf('Markdown Content:');
        if (cut >= 0) text = text.slice(cut + 17);
        var wrap = document.createElement('div');
        wrap.innerHTML = mdToHtml(text);
        rBody.appendChild(wrap);
      })
      .catch(function () {
        clearTimeout(timer);
        var sk = rBody.querySelector('.skeleton'); if (sk) sk.remove();
        var tip = document.createElement('p');
        tip.style.color = '#9B9B9B'; tip.style.fontSize = '13px';
        tip.textContent = '阅读模式暂时加载不了这篇文章，可以点下方「阅读原文」查看。';
        rBody.appendChild(tip);
      });
  }
  /* 阻止浏览器在历史/手势导航时自动乱动滚动位置 */
  if ('scrollRestoration' in history) { try { history.scrollRestoration = 'manual'; } catch (e) {} }
  function closeReader() {
    if (!readerOpen) return;
    if (readerAbort) readerAbort.abort();
    reader.classList.remove('open');
    reader.setAttribute('aria-hidden', 'true');
    document.getElementById('feedView').style.display = '';
    readerOpen = false;
    window.scrollTo(0, feedScrollY);
  }
  document.getElementById('rClose').addEventListener('click', closeReader);

  /* ---------- 下拉手势关闭阅读视图 ----------
     阅读页滚动到顶部后继续下拉，超过 76px 松手即返回列表；
     复用顶部提示胶囊，不对页面做任何位移。 */
  var dragStartY = null, dragReady = false;
  reader.addEventListener('touchstart', function (e) {
    if (!readerOpen || e.touches.length !== 1) { dragStartY = null; return; }
    if (window.scrollY <= 0) { dragStartY = e.touches[0].clientY; dragReady = false; }
    else { dragStartY = null; }
  }, { passive: true });
  reader.addEventListener('touchmove', function (e) {
    if (dragStartY === null) return;
    var dy = e.touches[0].clientY - dragStartY;
    if (dy > 12 && window.scrollY <= 0) {
      dragReady = dy > 76;
      ptrText.textContent = dragReady ? '松开返回列表' : '下拉返回列表';
      ptrEl.classList.add('show');
    }
  }, { passive: true });
  reader.addEventListener('touchend', function () {
    if (dragStartY === null) return;
    dragStartY = null;
    ptrEl.classList.remove('show');
    if (dragReady) { dragReady = false; closeReader(); }
  });
  document.getElementById('rOpen').addEventListener('click', function () {
    if (currentUrl) window.open(currentUrl, '_blank', 'noopener');
  });

  /* ---------- 数据加载 / 下拉刷新 ---------- */
  function loadData(showLoading) {
    if (state.loading) return Promise.resolve(false);
    state.loading = true;
    if (showLoading) { ptrText.textContent = '刷新中…'; ptrEl.classList.add('show', 'loading'); }
    document.getElementById('refreshBtn').classList.add('spinning');
    return fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function (d) {
        var isNew = !state.data || d.updatedAt !== state.data.updatedAt;
        state.data = d;
        renderAll();
        return isNew;
      })
      .finally(function () {
        state.loading = false;
        document.getElementById('refreshBtn').classList.remove('spinning');
        if (showLoading) setTimeout(function () { ptrEl.classList.remove('show', 'loading'); }, 500);
      });
  }
  function manualRefresh() {
    loadData(true).then(function (isNew) {
      if (!state.data) { toast('网络不佳，稍后再试'); return; }
      toast((isNew ? '已收到新快照 · ' : '已是最新 · ') + state.data.items.length + ' 条 · 更新于 ' + fmtShort(state.data.updatedAt));
    }).catch(function () { toast('网络不佳，稍后再试'); });
  }
  document.getElementById('refreshBtn').addEventListener('click', manualRefresh);

  var pullStart = null, pullReady = false;
  document.addEventListener('touchstart', function (e) {
    if (window.scrollY <= 0 && !reader.classList.contains('open') && e.touches.length === 1) {
      pullStart = e.touches[0].clientY; pullReady = false;
    } else { pullStart = null; }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (pullStart === null) return;
    var dy = e.touches[0].clientY - pullStart;
    if (dy > 12 && window.scrollY <= 0) {
      ptrEl.classList.add('show');
      pullReady = dy > 76;
      ptrText.textContent = pullReady ? '松开刷新' : '下拉获取最新情报';
    }
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (pullStart === null) return;
    pullStart = null;
    if (pullReady) { pullReady = false; window.scrollTo(0, 0); manualRefresh(); }
    else if (!state.loading) ptrEl.classList.remove('show');
  });

  /* ---------- 启动 ---------- */
  loadData(false).catch(function () {
    feedEl.innerHTML = '<div class="empty">加载失败，下拉重试</div>';
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
