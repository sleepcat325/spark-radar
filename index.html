<script>
(function () {
  var data = JSON.parse(document.getElementById('payload').textContent);
  var state = { filter: '全部' };
  var segEl = document.getElementById('seg');
  var feedEl = document.getElementById('feed');

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var diff = Date.now() - d.getTime();
    if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function fmtFull(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function isFresh(iso) {
    var d = new Date(iso);
    return !isNaN(d) && (Date.now() - d.getTime()) < 6 * 3600000;
  }
  function renderSeg() {
    var tags = ['全部'];
    data.items.forEach(function (it) { if (it.tag && tags.indexOf(it.tag) < 0) tags.push(it.tag); });
    if (tags.indexOf(state.filter) < 0) state.filter = '全部';
    segEl.innerHTML = '';
    tags.forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = t;
      b.className = t === state.filter ? 'on' : '';
      b.addEventListener('click', function () { state.filter = t; renderSeg(); renderFeed(); });
      segEl.appendChild(b);
    });
  }
  function renderFeed() {
    feedEl.innerHTML = '';
    var items = data.items.filter(function (it) { return state.filter === '全部' || it.tag === state.filter; });
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = '这个分类暂时没有新火花';
      feedEl.appendChild(e); return;
    }
    items.forEach(function (it, i) {
      var c = document.createElement('article');
      c.className = 'card' + (i === 0 && state.filter === '全部' ? ' hero' : '');
      var r1 = document.createElement('div'); r1.className = 'row1';
      var chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = it.tag || '未分类';
      r1.appendChild(chip);
      if (isFresh(it.publishedAt)) { var f = document.createElement('span'); f.className = 'fresh'; f.title = '6 小时内'; r1.appendChild(f); }
      var h = document.createElement('h2'); h.textContent = it.title || '';
      c.appendChild(r1); c.appendChild(h);
      if (it.summary) { var p = document.createElement('p'); p.textContent = it.summary; c.appendChild(p); }
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = [it.source, fmt(it.publishedAt)].filter(Boolean).join(' · ');
      c.appendChild(m);
      if (it.url) c.addEventListener('click', function () { window.open(it.url, '_blank', 'noopener'); });
      feedEl.appendChild(c);
    });
  }
  document.getElementById('updated').textContent = fmtFull(data.updatedAt) + ' 更新';
  document.getElementById('footTime').textContent = fmtFull(data.updatedAt);
  document.getElementById('summaryBar').textContent = data.summary || '';
  renderSeg(); renderFeed();
})();
</script>
</body>
